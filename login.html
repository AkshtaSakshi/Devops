<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>Animated Login Form</title>
        <style>
          *{
             margin: 0;
             padding: 0;
             box-sizing: border-box;
             font-family:Arial, sans-serif;

          }
          body{
            background:#111820;
           display:flex;
           justify-content:center;
           align-items:center;
           height:100vh;
         }
         .container{
             position:relative;
                width:900px;
                height:500px;
                background:#ef9b6b;
                border:4px solid #fff;
                border-radius:12px;
                overflow:hidden;
         }
          .character{
            position:absolute;
            left:130px;
            bottom:30px;
            width:120px;
            transition:5s;
          }
          .box{
            position:absolute;
            left:240px;
            bottom:35px;
            width:60px;
          }
          .login{
            position:absolute;
            right:0;
            width:350px;
            height:100px;
            background:fff;
            padding:100%;
            display:flex;
            flex-direction:column;
            justify-content:center;
            transform:translateX(100%);
            transition:6s;
        }
        .container:hover.login{
            transform:translateX(0);
        }
        .container:hover.character{
            transform:translateX(80px);
        }
        .login h2{
            margin-bottom:25px;
            text-align:center;
        }
        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }
        button{
            padding:12px;
            border:none;
            background:#28a745;
            color:#fff;
            border-radius:5px;
            cursor:pointer;
        }
        button:hover{
            background:#1f8a37;
        }
        </style>
        </head>
        <body>
            <div class="container">
            <img class="character" src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png">
            <img class="box" src="https://cdn-icons-png.flation.com/512/679/679720.png">
            <div class="long">
                <h2>login</h2>
                <input type="text"placeholder="Username">
                <input type="password"placeholder="password">
                <button>Login</button>
            </div>
        </div>
    </body>
    </html>
